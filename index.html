<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truth Table BD</title>
<meta name="description" content="Offline bilingual propositional-logic truth-table generator for students.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ET%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">T</span><span id="brandName">Truth Table BD</span></div>
  <div class="topbar-right">
    <span class="offline-note" id="offlineNote"></span>
    <button id="langToggle" class="ghost" type="button" aria-label="Switch language"></button>
  </div>
</header>
<main>
  <p class="tagline" id="tagline"></p>

  <section class="card" id="inputCard" aria-labelledby="exprLabel">
    <label class="field" id="exprLabel" for="expr"></label>
    <input type="text" id="expr" autocomplete="off" spellcheck="false" value="A &amp;&amp; B">
    <div class="row actions-row">
      <button id="generate" type="button"></button>
      <span class="hint" id="ctrlHint"></span>
    </div>
    <div id="error" class="error" hidden></div>
    <div id="loading" class="loading" hidden></div>
  </section>

  <section class="card" id="presetsCard" aria-labelledby="presetsTitle">
    <h2 id="presetsTitle"></h2>
    <div class="presets" id="presets"></div>
  </section>

  <div class="empty" id="empty" aria-live="polite">
    <h2 id="emptyTitle"></h2>
    <p id="emptyHint"></p>
  </div>

  <div id="results" hidden>
    <section class="card" aria-labelledby="tableTitle">
      <h2><span id="tableTitle"></span> <span class="rows-badge" id="rowsBadge"></span></h2>
      <div class="table-scroll"><table id="ttable" aria-describedby="tableTitle"></table></div>
      <div class="row actions-row">
        <button id="copyTsv" type="button" class="ghost"></button>
        <button id="downloadCsv" type="button" class="ghost"></button>
        <span class="copy-status" id="copyStatus" aria-live="polite"></span>
      </div>
    </section>

    <section class="card" aria-labelledby="classTitle">
      <h2 id="classTitle"></h2>
      <div id="classBody"></div>
    </section>

    <section class="card" aria-labelledby="canonTitle">
      <h2 id="canonTitle"></h2>
      <div class="canon-grid">
        <div class="canon-box"><h3 id="mintermLabel"></h3><code id="mintermVal"></code></div>
        <div class="canon-box"><h3 id="maxtermLabel"></h3><code id="maxtermVal"></code></div>
      </div>
    </section>
  </div>

  <section class="card" id="equivCard" aria-labelledby="equivTitle">
    <h2 id="equivTitle"></h2>
    <label class="field" id="expr2Label" for="expr2"></label>
    <input type="text" id="expr2" autocomplete="off" spellcheck="false">
    <div class="row actions-row">
      <button id="checkEquiv" type="button"></button>
    </div>
    <div id="error2" class="error" hidden></div>
    <div id="equivResult" class="verdict" aria-live="polite"></div>
  </section>

  <section class="card" id="opsCard" aria-labelledby="opsTitle">
    <h2 id="opsTitle"></h2>
    <p class="ops-help" id="opsHelp"></p>
  </section>
</main>
<footer><span id="footerNote"></span></footer>
<script src="js/logic.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
